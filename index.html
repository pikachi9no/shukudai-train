<!DOCTYPE html>
<html lang="ja" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>しゅくだい列車</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&amp;display=swap" rel="stylesheet">
<style>
/* VOICE everyday, for a first grader: big, calm, few words, hiragana
   IDEA a real station stamp booklet plus a station name sign
   PICTURE the station sign of where he is now (line colour band, prev / next)
   COLOUR white paper, ink black, the line's own colour leads (Yamanote green, Shinkansen blue), stamp ink in line colour
   TYPE M PLUS Rounded 1c 800 + 500
   LAYOUT sign full width, big depart button under it, stamp book grid, lines, adult settings folded; ride screen is black */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121412);--ink:light-dark(#1b1d1b,#eef0ec);--mut:light-dark(#62665f,#a3a89f);--paper:light-dark(#f5f3ec,#1c1f1c);--edge:light-dark(#d9d6cc,#343832);--lc:#7ac143}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 17px/1.6 "M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;overflow-x:clip}
.band{padding:clamp(20px,4vw,48px) max(5vw,16px)}
.wrap{max-width:1040px;margin:0 auto}
h1,h2{font-weight:800;line-height:1.1;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(26px,4vw,36px)}
h2{font-size:clamp(22px,3vw,28px);margin-bottom:12px}
.top{background:var(--lc);color:#fff}
.top .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top p{margin:0;font-size:16px}
.sign{background:#fff;color:#1b1d1b;border-radius:14px;margin-top:18px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.sign .main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;padding:22px clamp(16px,3vw,32px) 16px}
.num{border:4px solid var(--lc);border-radius:10px;padding:4px 8px;text-align:center;font-weight:800;line-height:1.05;min-width:64px}
.num b{display:block;font-size:14px}
.num span{font-size:26px}
.nm{text-align:center}
.nm .kana{font-size:clamp(18px,3vw,24px)}
.nm .kanji{font-size:clamp(44px,9vw,80px);font-weight:800;line-height:1.05;letter-spacing:.04em;overflow-wrap:anywhere}
.bar{background:var(--lc);color:#fff;display:flex;justify-content:space-between;gap:12px;padding:8px clamp(16px,3vw,32px);font-size:18px;font-weight:800}
.go{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:20px}
button{font:inherit;cursor:pointer;border-radius:999px;border:0;min-height:48px;padding:0 22px}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ffbf00;outline-offset:3px}
.big{background:#fff;color:#1b1d1b;font-size:26px;font-weight:800;padding:12px 40px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.big:disabled{opacity:.5;cursor:default}
.meter{flex:1 1 260px;font-size:16px}
.meter .track{height:12px;background:rgba(255,255,255,.35);border-radius:6px;overflow:hidden;margin-top:4px}
.meter .fill{height:100%;background:#fff}
.book{background:var(--paper)}
.bookhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.bookhead a{color:var(--ink);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:8px}
.cell{background:var(--bg);border:1px solid var(--edge);border-radius:10px;padding:6px;text-align:center}
.cell svg{width:100%;height:auto;display:block}
.cell .cap{font-size:13px;color:var(--mut);line-height:1.3}
.cell.here{outline:3px solid var(--lc);outline-offset:-3px}
.lines h3{font-size:20px;margin:22px 0 10px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.lsum{margin:0;font-weight:800;font-size:18px}
.tabs{display:none}
@media (orientation:landscape) and (min-width:900px){
html,body{height:100%}
.app{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);height:100%}
.top{overflow:auto;display:flex;flex-direction:column;justify-content:center;padding:20px 24px}
.top .wrap{width:100%}
.side{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg)}
.tabs{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--edge);background:var(--bg)}
.tabs button{flex:1;background:var(--paper);color:var(--ink);font-weight:800;font-size:18px}
.tabs button[aria-selected=true]{background:var(--lc);color:#fff}
.panes{flex:1;overflow:auto;min-height:0}
.panes .band{padding:20px 24px}
.side[data-tab=book] .sec-lines,.side[data-tab=book] .sec-set,.side[data-tab=lines] .book,.side[data-tab=lines] .sec-set,.side[data-tab=set] .book,.side[data-tab=set] .sec-lines{display:none}
.book{min-height:100%}
.sec-set details{border:0;padding:0}
.go{flex-direction:column;align-items:stretch}
.big{width:100%}
.meter{flex:none}
.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
}
.ln{border:2px solid var(--edge);border-radius:14px;padding:16px;background:var(--bg);color:var(--ink);text-align:left;display:block;width:100%;border-radius:14px}
.ln.on{border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.ln .t{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.ln .t i{width:18px;height:18px;border-radius:50%;background:var(--c);flex:none}
.ln .s{color:var(--mut);font-size:15px}
.badge{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:0 12px;font-size:14px;font-weight:800;margin-top:6px}
details{border-top:1px solid var(--edge);padding-top:12px}
summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
.set{display:grid;gap:14px;max-width:560px;margin-top:8px;font-size:16px}
.set label{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
select{font:inherit;font-size:16px;min-height:44px;border-radius:10px;border:1px solid var(--edge);background:var(--bg);color:var(--ink);padding:0 10px}
.ghost{background:transparent;border:2px solid var(--edge);color:var(--ink)}
textarea{display:block;width:100%;font:inherit;font-size:16px;border:1px solid var(--edge);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;margin:8px 0}
.small{font-size:14px;color:var(--mut);margin:4px 0 0}
.log{font-size:15px;color:var(--mut)}
/* overlays */
.ov{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;text-align:center;overflow:auto}
.ov.show{display:flex}
#ride{background:#000;color:#5d625b}
#ride .nx{font-size:20px}
#ride .nx b{display:block;font-size:clamp(34px,8vw,56px);color:#8b9187;line-height:1.2}
.dots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:520px}
.dots span{width:22px;height:22px;border-radius:50%;background:var(--lc)}
.dots span.new{animation:pop .6s ease-out}
#ride .msg{font-size:16px}
#ride .rk{display:block;font-size:clamp(18px,3.5vw,26px);color:#8b9187;margin-top:8px;line-height:1.3}
#ride button{background:#1d1f1d;color:#aab0a6;font-size:20px;padding:0 28px}
#res{background:color-mix(in srgb,var(--bg) 96%,transparent);color:var(--ink)}
#res h2{font-size:clamp(28px,5vw,40px)}
.stamps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:640px}
.stamps svg{width:110px;height:110px}
.stamps.got svg{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
.hold{position:relative;overflow:hidden;background:var(--lc);color:#fff;font-size:22px;font-weight:800;padding:12px 32px;user-select:none;-webkit-user-select:none;touch-action:none}
.hold i{position:absolute;inset:0;background:rgba(0,0,0,.25);transform-origin:left;transform:scaleX(0)}
.hold span{position:relative}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes stamp{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.dots span.new,.stamps.got svg{animation:none}}
@media(max-width:600px){.sign .main{grid-template-columns:minmax(0,1fr);justify-items:center;gap:6px}.big{width:100%}.bar{font-size:15px}}
</style>
</head>

<script type="application/json" id="st">{"line":"jy","pos":{"jy":0,"tk":0},"stamps":{"東京":"start"},"done":{},"min":3,"carry":0,"rides":[],"last":null,"t":0}</script>

<main class="app">
<section class="band top">
  <div class="wrap">
    <h1 id="lineTitle">やまのてせん</h1>
    <p id="today"></p>
  </div>
  <div class="wrap">
    <div class="sign" id="sign"></div>
    <div class="go">
      <button class="big" id="depart">出発！</button>
      <div class="meter" id="meter"></div>
    </div>
  </div>
</section>

<div class="side" id="side" data-tab="book">
<nav class="tabs" id="tabs"><button data-tab="book" aria-selected="true">スタンプ帳</button><button data-tab="lines" aria-selected="false">路線を選ぶ</button><button data-tab="set" aria-selected="false">大人の設定</button></nav>
<div class="panes">
<section class="band book">
  <div class="wrap">
    <div class="bookhead">
      <h2 id="bookTitle">駅スタンプ帳</h2>
      <a href="https://ekimero.com/" target="_blank" rel="noopener">集めた 駅の メロディは「どこでも駅メロ」で 聞こう</a>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="band">
  <div class="wrap">
    <h2 class="sec-lines-h">路線を 選ぶ</h2>
    <div class="lines" id="lines"></div>
  </div>
</section>

<section class="band">
  <div class="wrap">
    <details id="setd">
      <summary>大人の設定</summary>
      <div class="set">
        <label for="min">1駅進むのにかかる時間
          <select id="min">
            <option value="0.17">10秒（動作確認用）</option>
            <option value="1">1分</option>
            <option value="2">2分</option>
            <option value="3">3分</option>
            <option value="5">5分</option>
            <option value="10">10分</option>
          </select>
        </label>
        <p class="small">新幹線は駅間が長いため、この2倍の時間で1駅進みます。</p>
        <p class="small">宿題が終わったら、子どもが「とう着」を押します。大人が宿題を確認し、「車しょう かくにん」を2秒長押しするとスタンプが押されます。次の駅に届く前に終えた場合は「とちゅう下車」となり、その時間は引き継ぎません。</p>
        <div class="log" id="log"></div>
        <div class="bk">
          <p class="small">記録のバックアップ：「記録をコピー」で記録を文字にしてコピーし、メモなどに保存しておけます。元に戻すときは、その文字を貼り付けて「読み込む」を押します。</p>
          <button class="ghost" id="bkCopy">記録をコピー</button> <span id="bkMsg" class="small"></span>
          <textarea id="bkIn" rows="3" placeholder="ここにバックアップの文字を貼り付け"></textarea>
          <button class="ghost" id="bkLoad">読み込む</button>
        </div>
        <div><button class="ghost" id="reset">記録をすべて消去する（3秒長押し）</button></div>
      </div>
    </details>
  </div>
</section>

</div></div>
</main>

<div class="ov" id="ride" role="dialog" aria-label="走っています">
  <div class="nx" id="rideNext"></div>
  <div class="dots" id="rideDots"></div>
  <div class="msg" id="rideMsg">画面は 見ないで 宿題を がんばろう</div>
  <button id="arrive">とう着（終わり）</button>
</div>

<div class="ov" id="res" role="dialog" aria-label="とう着">
  <h2 id="resTitle"></h2>
  <div class="stamps" id="resStamps"></div>
  <p id="resMsg"></p>
  <button class="hold" id="approve"><i></i><span>車しょう かくにん（長おし）</span></button>
  <button class="ghost" id="resClose">とじる</button>
</div>

{id:'tx',name:'つくばえくすぷれす',kanji:'つくばエクスプレス',c:'#d6283b',code:'TX',cat:'pri',st:'秋葉原|あきはばら,新御徒町|しんおかちまち,浅草|あさくさ,南千住|みなみせんじゅ,北千住|きたせんじゅ,青井|あおい,六町|ろくちょう,八潮|やしお,三郷中央|みさとちゅうおう,南流山|みなみながれやま,流山セントラルパーク|ながれやませんとらるぱーく,流山おおたかの森|ながれやまおおたかのもり,柏の葉キャンパス|かしわのはきゃんぱす,柏たなか|かしわたなか,守谷|もりや,みらい平|みらいだいら,みどりの|みどりの,万博記念公園|ばんぱくきねんこうえん,研究学園|けんきゅうがくえん,つくば|つくば'}
];
const LINES = {};
for (const x of RAW) {
  x.k = x.cat === 'shin' ? 2 : 1;
  x.code = x.code || '';
  const st0 = x.st.split(',');
  x.st = st0.map((s, i) => { const [n, k, key] = s.split('|'); return {n, k, id: key || n, no: x.code ? x.code + String((x.start || 1) + (x.dir || 1) * i).padStart(2, '0') : ''}; });
  LINES[x.id] = x;
}
if (0) [].split(',').map((s, i) => { const [n, k] = s.split('|'); return {n, k, no: LINES[id].code ? LINES[id].code + String(i + 1).padStart(2, '0') : ''}; });
const ALL_JAPAN = 9000;

let S = JSON.parse($('st').textContent);
let art = null, artReady = false;
const LS = 'shukudai-train-v1';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

const today = () => { const d = new Date(); return (d.getMonth() + 1) + '/' + d.getDate(); };
const L = () => LINES[S.line];
const stPos = () => S.pos[S.line] || 0;
const lineCount = id => LINES[id].st.filter(s => S.stamps[s.id]).length;
const perStation = () => S.min * L().k * 60000;

function stampSvg(s, color, date, rot) {
  const len = [...s.n].length, fs = Math.min(30, 92 / len);
  return `<svg viewBox="0 0 120 120" aria-label="${s.n}"><g transform="rotate(${rot} 60 60)" style="opacity:.92">
  <circle cx="60" cy="60" r="54" fill="none" stroke="${color}" stroke-width="4"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="${color}" stroke-width="1.5"/>
  <text x="60" y="34" text-anchor="middle" font-size="11" font-weight="800" fill="${color}">${s.no || '★'}</text>
  <text x="60" y="${62 + fs / 3}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${color}">${s.n}</text>
  <text x="60" y="84" text-anchor="middle" font-size="${Math.min(10, 120 / [...s.k].length)}" fill="${color}">${s.k}</text>
  <text x="60" y="98" text-anchor="middle" font-size="10" fill="${color}">${date === 'start' ? '出発' : date}</text></g></svg>`;
}
function emptySvg(s) {
  return `<svg viewBox="0 0 120 120" aria-label="まだ"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--edge)" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="60" y="72" text-anchor="middle" font-size="34" font-weight="800" fill="var(--edge)">？</text></svg>`;
}
const rotOf = n => ([...n].reduce((a, c) => a + c.charCodeAt(0), 0) % 17) - 8;

function render() {
  const l = L(), st = l.st, p = stPos();
  document.documentElement.style.setProperty('--lc', l.c);
  $('lineTitle').textContent = l.kanji;
  $('today').textContent = l.name + '　今日は ' + today();
  const cur = st[p];
  const prev = p > 0 ? st[p - 1] : (l.loop ? st[st.length - 1] : null);
  const next = p < st.length - 1 ? st[p + 1] : (l.loop ? st[0] : null);
  $('sign').innerHTML = `<div class="main">${cur.no ? `<div class="num"><b>${l.code}</b><span>${cur.no.slice(l.code.length)}</span></div>` : '<div></div>'}
    <div class="nm"><div class="kana">${cur.k}</div><div class="kanji">${cur.n}</div></div><div></div></div>
    <div class="bar"><span>${prev ? '◀ ' + prev.n : ''}</span><span>今 ここ</span><span>${next ? next.n + ' ▶' : '終点'}</span></div>`;
  const ended = !next;
  $('depart').disabled = ended;
  $('depart').textContent = ended ? 'せいは！ ほかの 路線へ' : '出発！';
  const total = Object.keys(S.stamps).length, have = lineCount(S.line);
  $('meter').innerHTML = `${l.kanji} ${have} / ${st.length}駅<div class="track"><div class="fill" style="width:${have / st.length * 100}%"></div></div>
    <div style="margin-top:6px">日本の 駅 全部（約${ALL_JAPAN.toLocaleString()}駅）まで あと ${(ALL_JAPAN - total).toLocaleString()}駅</div>`;
  $('bookTitle').textContent = l.kanji + ' スタンプ帳';
  $('grid').innerHTML = st.map((s, i) => `<div class="cell${i === p ? ' here' : ''}">${S.stamps[s.id] ? stampSvg(s, l.c, S.stamps[s.id], rotOf(s.n)) : emptySvg(s)}
    <div class="cap">${S.stamps[s.id] ? s.k : 'まだ'}</div></div>`).join('');
  $('lines').innerHTML = `<p class="lsum">せいはした路線 ${RAW.filter(x => S.done[x.id]).length} / ${RAW.length}</p>` + CATS.map(([cat, lab]) => `<h3>${lab}</h3><div class="lgrid">` + RAW.filter(x => x.cat === cat).map(x => [x.id, x]).map(([id, x]) => `<button class="ln${id === S.line ? ' on' : ''}" data-line="${id}" style="--c:${x.c}">
    <span class="t"><i></i>${x.kanji}</span><span class="s">${x.name}<br>${lineCount(id)} / ${x.st.length}駅</span>
    ${S.done[id] ? `<span class="badge">せいは ${S.done[id]}</span>` : ''}</button>`).join('') + '</div>').join('');
  $('min').value = String(S.min);
  const rides = S.rides.slice(-7).reverse();
  $('log').innerHTML = rides.length ? '最近の記録：<br>' + rides.map(r => `${r.d}　${r.m}分　${r.n}駅`).join('<br>') : 'まだ記録はありません';
}

/* ---- saving ---- */
function docWith(state) {
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  return TEMPLATE.replace(/(<script type="application\/json" id="st">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
}
async function save(celebrate) {
  S.t = Date.now();
  lsSet(LS, JSON.stringify(S));
  if (art) {
    try { await art.publish(docWith(S)); return; }
    catch (e) { if (String(e && (e.code || e.message || e)).includes('conflict')) return; }
  }
  render();
  if (celebrate) showCelebration();
}

/* ---- ride ---- */
let rideStart = 0, tick = 0, wake = null, shown = 0;
function rideInfo() {
  const el = Date.now() - rideStart + (S.carry || 0);
  const l = L(), p = stPos();
  let n = Math.floor(el / perStation());
  if (!l.loop) n = Math.min(n, l.st.length - 1 - p);
  return {el, n, minutes: Math.round((Date.now() - rideStart) / 60000)};
}
function stationAt(k) { const l = L(), n = l.st.length; return l.st[(((stPos() + k) % n) + n) % n]; }
function drawRide() {
  const {n} = rideInfo();
  const nx = stationAt(n + 1), l = L();
  const end = !l.loop && stPos() + n >= l.st.length - 1;
  $('rideNext').innerHTML = end ? '終点に 着きました' : `次は<span class="rk">${nx.k}</span><b>${nx.n}</b>`;
  if (n !== shown || !$('rideDots').children.length) {
    $('rideDots').innerHTML = Array.from({length: n}, (_, i) => `<span class="${i >= shown ? 'new' : ''}"></span>`).join('');
    if (n > shown) { try { navigator.vibrate && navigator.vibrate(200); } catch (e) {} }
    shown = n;
  }
}
async function startRide(resumeAt) {
  rideStart = resumeAt || Date.now();
  lsSet(LS + '-ride', JSON.stringify({t: rideStart, line: S.line}));
  shown = -1; $('rideDots').innerHTML = '';
  $('ride').classList.add('show');
  drawRide(); shown = rideInfo().n; drawRide();
  tick = setInterval(drawRide, 1000);
  if (!resumeAt) { try { await document.documentElement.requestFullscreen(); } catch (e) {} }
  try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function stopRide() {
  clearInterval(tick);
  try { wake && wake.release(); } catch (e) {}
  try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {}
  $('ride').classList.remove('show');
}
let pending = null;
function arrive() {
  const info = rideInfo();
  stopRide();
  pending = info;
  const l = L();
  const list = Array.from({length: info.n}, (_, i) => stationAt(i + 1));
  $('resTitle').textContent = info.n ? `${info.n}駅 進んだ！` : 'まだ 次の 駅の 手前';
  $('resStamps').className = 'stamps';
  $('resStamps').innerHTML = list.map(s => `<div style="opacity:.35">${stampSvg(s, l.c, today(), rotOf(s.n))}</div>`).join('');
  $('resMsg').textContent = info.n ? '車しょうさん（大人）に 宿題を 見せてね' : '次の 駅まで あと 少し。今日は ここで とちゅう下車？';
  $('approve').querySelector('span').textContent = '車しょう かくにん（長おし）';
  $('approve').style.display = info.n ? '' : 'none';
  $('resClose').textContent = info.n ? 'やりなおす（スタンプなし）' : 'とちゅう下車する';
  $('res').classList.add('show');
}
function apply() {
  const info = pending; if (!info) return;
  pending = null;
  lsDel(LS + '-ride');
  const l = L(), news = [];
  for (let i = 1; i <= info.n; i++) { const s = stationAt(i); if (!S.stamps[s.id]) { S.stamps[s.id] = today(); news.push(s.id); } }
  S.pos[S.line] = (stPos() + info.n) % l.st.length;
  S.carry = info.el - info.n * perStation();
  if (!l.loop && S.pos[S.line] >= l.st.length - 1) S.carry = 0;
  let done = false;
  if (!S.done[S.line] && l.st.every(s => S.stamps[s.id])) { S.done[S.line] = today(); done = true; }
  S.rides.push({d: today(), m: info.minutes, n: info.n});
  if (S.rides.length > 200) S.rides = S.rides.slice(-200);
  S.last = info.n ? {t: Date.now(), line: S.line, ids: Array.from({length: info.n}, (_, i) => stationAt(i - info.n + 1).id), news, done} : null;
  $('res').classList.remove('show');
  save(true);
}
function showCelebration() {
  const c = S.last; if (!c || lsGet(LS + '-seen') === String(c.t)) return;
  lsSet(LS + '-seen', String(c.t));
  const l = LINES[c.line];
  const sts = c.ids.map(n => l.st.find(s => s.id === n)).filter(Boolean);
  $('resTitle').textContent = c.done ? `${l.kanji} せいは！` : (c.news.length ? `スタンプ ${c.news.length}こ ゲット！` : `${sts.length}駅 進んだ！`);
  $('resStamps').className = 'stamps got';
  $('resStamps').innerHTML = sts.map((s, i) => `<div style="animation-delay:${i * .25}s">${stampSvg(s, l.c, S.stamps[s.id] || today(), rotOf(s.n))}</div>`).join('');
  $('resStamps').querySelectorAll('svg').forEach((v, i) => v.style.animationDelay = (i * .25) + 's');
  $('resMsg').textContent = c.news.length ? 'スタンプ帳に おしたよ' : 'もう 持っている 駅だったよ。でも ちゃんと 進んだ！';
  $('approve').style.display = 'none';
  $('resClose').textContent = 'とじる';
  $('res').classList.add('show');
}

/* ---- long press ---- */
function holdable(btn, ms, fn) {
  let t = 0, raf = 0, bar = btn.querySelector('i');
  const stop = () => { cancelAnimationFrame(raf); t = 0; if (bar) bar.style.transform = 'scaleX(0)'; };
  const step = () => { const k = (performance.now() - t) / ms; if (bar) bar.style.transform = `scaleX(${Math.min(k, 1)})`;
    if (k >= 1) { stop(); fn(); } else raf = requestAnimationFrame(step); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); t = performance.now(); raf = requestAnimationFrame(step); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---- events ---- */
$('depart').addEventListener('click', () => startRide());
$('arrive').addEventListener('click', arrive);
holdable($('approve'), 2000, apply);
$('resClose').addEventListener('click', () => {
  const drop = pending && S.carry;
  if (pending) { pending = null; lsDel(LS + '-ride'); }
  $('res').classList.remove('show');
  if (drop) { S.carry = 0; save(false); }
});
$('lines').addEventListener('click', e => {
  const b = e.target.closest('[data-line]'); if (!b || b.dataset.line === S.line) return;
  S.line = b.dataset.line; S.carry = 0;
  const first = L().st[0];
  if (!S.stamps[first.id]) S.stamps[first.id] = 'start';
  save(false);
});
$('min').addEventListener('change', e => { S.min = Number(e.target.value); S.carry = 0; save(false); });
const rb = $('reset'); rb.insertAdjacentHTML('afterbegin', '<i></i>'); rb.classList.add('hold');
rb.style.background = 'transparent'; rb.style.color = 'var(--ink)';
holdable(rb, 3000, () => { S = {line: 'jy', pos: {jy: 0, tk: 0}, stamps: {'東京': 'start'}, done: {}, min: S.min, carry: 0, rides: [], last: null, t: 0}; save(false); });

$('bkCopy').addEventListener('click', async () => {
  const txt = 'SHUKUDAI1:' + btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  try { await navigator.clipboard.writeText(txt); $('bkMsg').textContent = 'コピーしました。メモなどに貼り付けて保存してください。'; }
  catch (e) { $('bkIn').value = txt; $('bkIn').select(); $('bkMsg').textContent = '下の文字をすべて選んでコピーしてください。'; }
});
$('bkLoad').addEventListener('click', () => {
  try {
    const v = $('bkIn').value.trim().replace(/^SHUKUDAI1:/, '');
    const o = JSON.parse(decodeURIComponent(escape(atob(v))));
    if (!o || typeof o.stamps !== 'object' || typeof o.pos !== 'object' || !LINES[o.line]) throw 0;
    S = o; $('bkIn').value = ''; $('bkMsg').textContent = '読み込みました。'; save(false);
  } catch (e) { $('bkMsg').textContent = '読み込めませんでした。文字が全部貼り付けられているか確認してください。'; }
});
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  $('side').dataset.tab = b.dataset.tab;
  for (const x of $('tabs').children) x.setAttribute('aria-selected', String(x === b));
  if (b.dataset.tab === 'set') $('setd').open = true;
  $('side').querySelector('.panes').scrollTop = 0;
});
{ const secs = document.querySelectorAll('.panes > section'); if (secs[1]) secs[1].classList.add('sec-lines'); if (secs[2]) secs[2].classList.add('sec-set'); }

/* ---- boot ---- */
render();
const r = lsGet(LS + '-ride');
if (r) { try { const o = JSON.parse(r); if (o.line === S.line && Date.now() - o.t < 4 * 3600000) startRide(o.t); else lsDel(LS + '-ride'); } catch (e) {} }
showCelebration();
Promise.resolve(window.claude && window.claude.use ? window.claude.use('artifact') : null).then(a => {
  art = a; artReady = true;
  if (!art) {
    try { const loc = JSON.parse(lsGet(LS) || 'null'); if (loc && loc.t > (S.t || 0)) { S = loc; render(); } } catch (e) {}
  }
}).catch(() => { artReady = true; });
}
